name: Feature request
description: Propose a product or engineering change
title: '[feat] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem are we solving?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What should we intentionally leave out?
  - type: dropdown
    id: financial
    attributes:
      label: Does this touch financial correctness?
      options:
        - 'No'
        - 'Yes — needs invariant tests'
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable Given / When / Then bullets.
    validations:
      required: true
