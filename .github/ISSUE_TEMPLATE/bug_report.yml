name: Bug report
description: Report incorrect behavior or a regression
title: '[bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Prefer reproducible steps and expected vs actual behavior.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands, UI clicks, or API calls.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: financial
    attributes:
      label: Does this affect balances, budgets, or categorization?
      options:
        - 'No'
        - 'Yes'
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, PHP/Node versions, browser, commit SHA if known.
  - type: checkboxes
    id: verify
    attributes:
      label: Local checks
      options:
        - label: I ran `./scripts/verify.sh` (or note why not)
          required: false
