name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        working-directory: backend
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm to match local lockfile generation
        run: npm install -g npm@11.6.2

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit Composer advisories
        working-directory: backend
        continue-on-error: true
        run: composer audit --no-interaction

      - name: Audit npm production dependencies
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Prepare backend environment for CI
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          touch database/database.sqlite

      - name: Validate migrations and seeders
        working-directory: backend
        run: php artisan migrate:fresh --seed --force --no-interaction

      - name: Run project verification
        run: ./scripts/verify.sh
